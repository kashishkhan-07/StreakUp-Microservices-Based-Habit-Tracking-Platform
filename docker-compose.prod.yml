version: '3.8'

services:
  # 1. API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: streakup-api-gateway
    restart: always
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - CLIENT_URL=${CLIENT_URL:-http://localhost}
      - JWT_SECRET=${JWT_SECRET:-streakup_super_secret_jwt_key_2026_dev}
      - AUTH_SERVICE_URL=http://auth-service:5001
      - HABIT_SERVICE_URL=http://habit-service:5002
      - ANALYTICS_SERVICE_URL=http://analytics-service:5003
      - NOTIFICATION_SERVICE_URL=http://notification-service:5004
    depends_on:
      - auth-service
      - habit-service
      - analytics-service
      - notification-service
    networks:
      - streakup-network

  # 2. Auth Service
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: streakup-auth-service
    restart: always
    ports:
      - '5001:5001'
    environment:
      - PORT=5001
      - MONGO_URI=${MONGO_URI_AUTH}
      - JWT_SECRET=${JWT_SECRET:-streakup_super_secret_jwt_key_2026_dev}
    networks:
      - streakup-network

  # 3. Habit Service
  habit-service:
    build:
      context: .
      dockerfile: services/habit-service/Dockerfile
    container_name: streakup-habit-service
    restart: always
    ports:
      - '5002:5002'
    environment:
      - PORT=5002
      - MONGO_URI=${MONGO_URI_HABITS}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - JWT_SECRET=${JWT_SECRET:-streakup_super_secret_jwt_key_2026_dev}
    networks:
      - streakup-network

  # 4. Analytics Service
  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    container_name: streakup-analytics-service
    restart: always
    ports:
      - '5003:5003'
    environment:
      - PORT=5003
      - MONGO_URI=${MONGO_URI_ANALYTICS}
      - HABIT_SERVICE_URL=http://habit-service:5002
      - JWT_SECRET=${JWT_SECRET:-streakup_super_secret_jwt_key_2026_dev}
    depends_on:
      - habit-service
    networks:
      - streakup-network

  # 5. Notification Service
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: streakup-notification-service
    restart: always
    ports:
      - '5004:5004'
    environment:
      - PORT=5004
      - MONGO_URI=${MONGO_URI_NOTIFICATIONS}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - JWT_SECRET=${JWT_SECRET:-streakup_super_secret_jwt_key_2026_dev}
    networks:
      - streakup-network

  # 6. React Frontend (Nginx Static Serve)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5000/api}
    container_name: streakup-frontend
    restart: always
    ports:
      - '80:80'
    depends_on:
      - api-gateway
    networks:
      - streakup-network

networks:
  streakup-network:
    driver: bridge
